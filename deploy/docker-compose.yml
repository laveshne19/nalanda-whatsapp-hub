# Full stack for the Hostinger VPS: OpenWA + hub + HTTPS front door.
# Secrets come from the project environment (Hostinger Docker manager), never from this file.
name: openwa
services:
  openwa-api:
    image: ghcr.io/rmyndharis/openwa:0.31.0
    container_name: openwa-api
    restart: unless-stopped
    stop_grace_period: 45s
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 2048
    mem_limit: 2g
    ports:
      - '127.0.0.1:2785:2785'
    environment:
      - NODE_ENV=production
      - TZ=Asia/Kolkata
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_CACHE_HOME=/tmp/.cache
      - PORT=2785
      - ENGINE_TYPE=whatsapp-web.js
      - AUTO_START_SESSIONS=true
      - DATABASE_SYNCHRONIZE=false
      - SEND_PACING_ENABLED=true
      - SEND_PACING_WARMUP_SCHEDULE=1000
      - SEND_PACING_COLD_DAILY_CAP=1000
      - SEND_PACING_BREAKER_THRESHOLD=5
      - SEND_PACING_BREAKER_COOLDOWN_MS=900000
      - SIMULATE_TYPING=true
      - MCP_ENABLED=true
      - MCP_READONLY=true
      - WWEBJS_WEB_VERSION=off
      # the hub needs the sender's phone number in each incoming message
      - RESOLVE_LID_TO_PHONE=true
      # allow OpenWA to call the hub on the private network (blocked by default)
      - SSRF_ALLOWED_HOSTS=nalanda-hub
      - BASE_URL=https://srv1693296.hstgr.cloud
      - CORS_ORIGINS=https://srv1693296.hstgr.cloud,https://147-93-96-18.sslip.io
      - TRUSTED_PROXIES=172.16.0.0/12
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:2785/api/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nalanda-hub:
    image: ghcr.io/laveshne19/nalanda-whatsapp-hub:latest
    container_name: nalanda-hub
    restart: unless-stopped
    depends_on:
      openwa-api:
        condition: service_healthy
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 256m
    environment:
      - PORT=8080
      - TZ=Asia/Kolkata
      - OPENWA_URL=http://openwa-api:2785
      - OPENWA_API_KEY=${HUB_OPENWA_KEY}
      - OPENWA_SESSION_ID=${OPENWA_SESSION_ID}
      - WEBHOOK_SECRET=${HUB_WEBHOOK_SECRET}
      - HUB_WEBHOOK_URL=http://nalanda-hub:8080/webhook/openwa
      - LEADS_SECRET=${HUB_LEADS_SECRET}
      - SHOPIFY_SHOP_DOMAIN=${SHOPIFY_SHOP_DOMAIN}
      - SHOPIFY_CLIENT_ID=${SHOPIFY_CLIENT_ID}
      - SHOPIFY_CLIENT_SECRET=${SHOPIFY_CLIENT_SECRET}
      - STAFF_CHAT_ID=919569913332@c.us
      - WHOLESALE_CONTACT=+91 95699 13332
      - REPORT_HOUR_IST=20
      - REPLIES_PER_CHAT_PER_HOUR=${REPLIES_PER_CHAT_PER_HOUR:-10}
      - STATE_PATH=/app/data/state.json
    volumes:
      - hub-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.8.4-alpine
    container_name: openwa-caddy
    restart: unless-stopped
    depends_on:
      - openwa-api
      - nalanda-hub
    ports:
      - '80:80'
      - '443:443'
    # Only the signed website-enquiry path reaches the hub. Everything else goes to OpenWA.
    command:
      - sh
      - -c
      - |
        printf '%s\n' 'srv1693296.hstgr.cloud, 147-93-96-18.sslip.io {' '  handle /lead/website {' '    reverse_proxy nalanda-hub:8080' '  }' '  handle {' '    reverse_proxy openwa-api:2785' '  }' '}' > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  openwa-data:
  hub-data:
  caddy-data:
  caddy-config:
